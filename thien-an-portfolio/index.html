<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thiên Ân · Portfolio Sư phạm Âm nhạc</title>
<style>
html,body{min-height:100%;margin:0;background:#070d1f;color:#e9eefc;font:16px system-ui,sans-serif}
body{display:grid;place-items:center}
#loading{padding:24px;text-align:center}
</style>
</head>
<body>
<div id="loading">Đang tải Portfolio Thiên Ân…</div>
<script>
(async()=>{
  try {
    const paths=Array.from({length:41},(_,i)=>"./payload/segment-"+String(i).padStart(3,"0")+".txt");
    const parts=await Promise.all(paths.map(async path=>{
      const response=await fetch(path);
      if(!response.ok) throw new Error("Không tải được "+path);
      return response.text();
    }));
    document.open();
    document.write(parts.join(""));
    document.close();
  } catch(error) {
    const status=document.getElementById("loading");
    if(status) status.textContent="Không thể tải Portfolio Thiên Ân. Vui lòng tải lại trang.";
  }
})();
</script>
</body>
</html>
